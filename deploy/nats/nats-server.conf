# NATS single node - шина сообщений агентов sigma-mate.
# Одна нода, без кластера, репликации и JetStream.
# Авторизация не нужна: нода локальная, доступ с dev-машины.

# Порт для клиентов (NATS-протокол)
listen: "0.0.0.0:4222"

# Мониторинг (HTTP /varz, /connz) - только с самой машины
http: "127.0.0.1:8222"

# Максимальный размер одного сообщения
max_payload: 1MB

# Логи в journald
logtime: true
debug: false
trace: false
